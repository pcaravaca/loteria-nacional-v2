<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Gemas">
  <defs>
    <radialGradient id="glow" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#123f31"/>
      <stop offset="55%" stop-color="#0a100d"/>
      <stop offset="100%" stop-color="#05080c"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5dd9a"/>
      <stop offset="100%" stop-color="#c9a227"/>
    </linearGradient>
    <linearGradient id="gemGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7cf7c4"/>
      <stop offset="100%" stop-color="#0f9d6b"/>
    </linearGradient>
    <linearGradient id="gemBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9fd8ff"/>
      <stop offset="100%" stop-color="#2277cc"/>
    </linearGradient>
    <linearGradient id="gemPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9b8ff"/>
      <stop offset="100%" stop-color="#7b3fd1"/>
    </linearGradient>
    <linearGradient id="gemRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb3b3"/>
      <stop offset="100%" stop-color="#d62839"/>
    </linearGradient>
    <linearGradient id="gemYellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="100%" stop-color="#e0a200"/>
    </linearGradient>
    <linearGradient id="gemOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd29b"/>
      <stop offset="100%" stop-color="#e2680a"/>
    </linearGradient>
    <linearGradient id="gemWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#9fb3c8"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7cf7c4"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="65%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f5b942"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" rx="18" fill="url(#glow)"/>
  <rect x="8" y="8" width="384" height="284" rx="14" fill="none" stroke="url(#gold)" stroke-width="2" opacity=".55"/>

  <!-- tablero -->
  <g transform="translate(70,42)">
    <rect width="260" height="216" rx="12" fill="#080b10" stroke="#243448"/>
    <!-- gemas base -->
    <g stroke="#0b1118" stroke-width="2">
      <rect x="8" y="8" width="44" height="44" rx="12" fill="url(#gemPurple)"/>
      <circle cx="80" cy="30" r="22" fill="url(#gemBlue)"/>
      <rect x="108" y="8" width="44" height="44" rx="12" fill="url(#gemRed)"/>
      <rect x="160" y="8" width="44" height="44" rx="12" fill="url(#gemGreen)" transform="rotate(45 182 30)"/>
      <circle cx="232" cy="30" r="22" fill="url(#gemYellow)"/>

      <circle cx="30" cy="82" r="22" fill="url(#gemOrange)"/>
      <rect x="52" y="60" width="44" height="44" rx="12" fill="url(#gemGreen)"/>
      <rect x="108" y="60" width="44" height="44" rx="12" fill="url(#gemPurple)"/>
      <circle cx="182" cy="82" r="22" fill="url(#gemBlue)"/>
      <rect x="208" y="60" width="44" height="44" rx="12" fill="url(#gemRed)" transform="rotate(45 230 82)"/>

      <rect x="8" y="112" width="44" height="44" rx="12" fill="url(#gemRed)"/>
      <circle cx="80" cy="134" r="22" fill="url(#gemYellow)"/>
      <rect x="108" y="112" width="44" height="44" rx="12" fill="url(#gemOrange)"/>
      <rect x="160" y="112" width="44" height="44" rx="12" fill="url(#gemGreen)"/>
      <circle cx="232" cy="134" r="22" fill="url(#gemPurple)"/>

      <circle cx="30" cy="186" r="22" fill="url(#gemBlue)"/>
      <rect x="52" y="164" width="44" height="44" rx="12" fill="url(#gemYellow)" transform="rotate(45 74 186)"/>
      <rect x="108" y="164" width="44" height="44" rx="12" fill="url(#gemPurple)"/>
      <circle cx="182" cy="186" r="22" fill="url(#gemOrange)"/>
      <rect x="208" y="164" width="44" height="44" rx="12" fill="url(#gemGreen)"/>
    </g>
    <!-- brillo -->
    <g fill="#ffffff" opacity=".55">
      <ellipse cx="20" cy="20" rx="8" ry="5"/>
      <ellipse cx="70" cy="20" rx="8" ry="5"/>
      <ellipse cx="120" cy="20" rx="8" ry="5"/>
      <ellipse cx="20" cy="72" rx="8" ry="5"/>
      <ellipse cx="120" cy="72" rx="8" ry="5"/>
      <ellipse cx="20" cy="124" rx="8" ry="5"/>
      <ellipse cx="120" cy="124" rx="8" ry="5"/>
      <ellipse cx="20" cy="176" rx="8" ry="5"/>
      <ellipse cx="120" cy="176" rx="8" ry="5"/>
    </g>
  </g>

  <!-- gema rayo con rel&#225;mpagos -->
  <g transform="translate(318,96)">
    <circle cx="32" cy="32" r="30" fill="url(#ray)"/>
    <circle cx="32" cy="32" r="30" fill="none" stroke="#ffffff" stroke-width="2" opacity=".7"/>
    <circle cx="32" cy="32" r="12" fill="#fff7d6"/>
    <path d="M32 2 L38 22 L32 18 L26 22 Z" fill="#ffffff" opacity=".9"/>
    <path d="M32 62 L38 44 L32 48 L26 44 Z" fill="#ffffff" opacity=".9"/>
    <path d="M2 32 L22 26 L18 32 L22 38 Z" fill="#ffffff" opacity=".9"/>
    <path d="M62 32 L44 26 L48 32 L44 38 Z" fill="#ffffff" opacity=".9"/>
  </g>
  <g stroke="#f5dd9a" stroke-width="3" fill="none" stroke-linecap="round" opacity=".9">
    <path d="M300 70 L268 96 L286 100 L262 128"/>
    <path d="M356 150 L330 132 L344 128 L322 100"/>
  </g>

  <!-- texto -->
  <text x="200" y="278" text-anchor="middle" font-family="Space Grotesk, Inter, sans-serif" font-size="22" font-weight="700" fill="url(#gold)">GEMAS</text>
</svg>
